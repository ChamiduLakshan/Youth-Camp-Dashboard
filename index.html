<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="dashboard-style.css">
</head>
<body>

    <div class="portal-wrapper">
        
        <header class="portal-header">
            <div class="logo-container">
                <img src="images/nyclogo.jpeg" alt="University Logo" class="uni-logo">
                <h3>National Youth Corps</h3>
            </div>
        </header>

        <section class="portal-banner">
            <div class="banner-content">
                <h1>Welcome to The Student Zone</h1>
            </div>
        </section>

        
        <main class="portal-main">
            <div class="cards-container">
                
            
                <a href="complaints.html" class="portal-card student-card">
                    <div class="card-icon">
                        <svg class="portal-svg-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2Z" fill="currentColor" opacity="0.15"/>
                            <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2ZM13 9V3.5L18.5 9H13ZM12 17C11.45 17 11 16.55 11 16C11 15.45 11.45 15 12 15C12.55 15 13 15.45 13 16C13 16.55 12.55 17 12 17ZM13 13H11V10H13V13Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="card-text">Student Complaints</span>
                </a>

                <a href="https://ee.kobotoolbox.org/x/YTuUhhAT" class="portal-card applicant-card">
                    <div class="card-icon">
                        <svg class="portal-svg-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z" fill="currentColor" opacity="0.15"/>
                            <path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2ZM20 16H5.17L4 17.17V4H20V16ZM12 13.08L14.47 14.57L13.84 11.77L16.01 9.88L13.14 9.63L12 7L10.86 9.63L7.99 9.88L10.16 11.77L9.53 14.57L12 13.08Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="card-text">Feedback Form</span>
                </a>
                <form id="loginForm" class="login-form">
                    <button type="submit" class="btn-login">Go Back</button>
                </form>
        </main>
    </div>

</body>
<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault(); 
        window.location.href = "login.html"; 
    });
</script>
</html>
