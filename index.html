<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            
            <div class="company-logo-wrapper">
                <div class="undp-logo">
                    <div class="emblem">🇺🇳</div>
                    <div class="brand-text"><span>U N</span><span>D P</span></div>
                </div>
                <div class="access-title">ACCESS</div>
            </div>

            <p class="description">
                The single sign-on page provides users across UNDP and our UN partner agencies with simple access to the relevant corporate platform using your existing agency credentials.
            </p>

            <div class="action-buttons">
                <button class="btn btn-primary">UNDP Users and Guests</button>
                <button class="btn btn-primary">UNDP Partners using Microsoft 365</button>
                <button class="btn btn-primary">UNall Invited Guests</button>
            </div>

            <div class="partner-section">
                <div class="partner-label">Specific partner login:</div>
                <div class="partner-grid">
                    <button class="btn btn-secondary">UNFPA</button>
                    <button class="btn btn-secondary">UNOPS</button>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
