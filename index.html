<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="dashboard-style.css">
</head>
<body>

    <div class="portal-wrapper">
        
        <header class="portal-header">
            <div class="logo-container">
                <!-- Replace with your actual university/camp logo path -->
                <img src="images/nyclogo.jpeg" alt="University Logo" class="uni-logo">
            </div>
        </header>

        <section class="portal-banner">
            <div class="banner-content">
                <h1>Welcome to the Dashboard</h1>
            </div>
        </section>

        
        <main class="portal-main">
            <div class="cards-container">
                
            
                <a href="student-login.html" class="portal-card student-card">
                    <div class="card-icon">
                        
                        <div class="dot-circle-icon"></div>
                    </div>
                    <span class="card-text">Student Complaints</span>
                </a>

                <a href="applicant-login.html" class="portal-card applicant-card">
                    <div class="card-icon">
                        <svg class="avatar-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </div>
                    <span class="card-text">Feedback Form</span>
                </a>

            </div>


            <div class="portal-utilities">
                <a href="#" class="utility-link">Password Management</a>
                
                <div class="help-box">
                    <h3>Login help</h3>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
