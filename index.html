<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome:Youth Camp Portal</title>
    <link rel="stylesheet" href="dashboard-style.css">
</head>
<body>

    <div class="portal-wrapper">
        <!-- 1. Top University Header -->
        <header class="portal-header">
            <div class="logo-container">
                <!-- Replace with your actual university/camp logo path -->
                <img src="images/YouthCampLogo.jpeg" alt="Camp Logo" class="uni-logo"><h4>Youth Camp 2026</h4>
            </div>
        </header>

        <!-- 2. Dark Blue Title Banner Section -->
        <section class="portal-banner">
            <div class="banner-content">
                <b><h1>Welcome to Dashboard:Youth Camp 2026</h1></b>
            </div>
        </section>

        <!-- 3. Dynamic Menu Cards Area -->
        <main class="portal-main">
            <div class="cards-container">
                
                <!-- Student Card Button -->
                <a href="student-login.html" class="portal-card student-card">
                    <div class="card-icon">
                        <!-- Custom CSS Dot Matrix Circle Icon representing the screenshot icon -->
                        <div class="dot-circle-icon"></div>
                    </div>
                    <span class="card-text">Staff login</span>
                </a>

                <!-- Applicant Card Button -->
                <a href="feedback.html" class="portal-card applicant-card">
                    <div class="card-icon">
                        <!-- Silhouette Avatar Icon -->
                        <svg class="avatar-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </div>
                    <span class="card-text">Feedback Form</span>
                </a>

            </div>
            <form id="loginForm" class="login-form">
                <button type="submit" class="btn-login">Go Back</button>
            </form>
        </main>
        
    </div>

</body>
<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault(); 
        window.location.href = "login.html"; 
    });
</script>
</html>
