<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome|Student Portal</title>
    <link rel="stylesheet" href="dashboard-style.css">
</head>
<body>

    <div class="portal-wrapper">
        <!-- 1. Top University Header -->
        <header class="portal-header">
            <div class="logo-container">
                <!-- Replace with your actual university/camp logo path -->
                <img src="images/YouthCampLogo.jpeg" alt="University Logo" class="uni-logo">
                <h3>WELCOME TO YOUTH CAMP 2026</h3>
            </div>
        </header>

        <!-- 2. Dark Blue Title Banner Section -->
        <section class="portal-banner">
            <div class="banner-content">
                <h1>Log in to Student Feedback Form</h1>
            </div>
        </section>

        <!-- 3. Dynamic Menu Cards Area -->
        <main class="portal-main">
            <div class="cards-container">
                
                <!-- Student Card Button -->
                <a href="student-login.html" class="portal-card student-card">
                    <div class="card-icon">
                        <svg class="avatar-icon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </div>
                    <span class="card-text">NYC Staff login</span>
                </a>

                <!-- Applicant Card Button -->
                <a href="applicant-login.html" class="portal-card applicant-card">
                    <div class="card-icon">
                        <!-- Silhouette Avatar Icon -->
                        <svg class="portal-svg-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z" fill="currentColor" opacity="0.15"/>
                            <path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2ZM20 16H5.17L4 17.17V4H20V16ZM12 13.08L14.47 14.57L13.84 11.77L16.01 9.88L13.14 9.63L12 7L10.86 9.63L7.99 9.88L10.16 11.77L9.53 14.57L12 13.08Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <span class="card-text">Student Feedback</span>
                </a>

            </div>

            <!-- Bottom Utilities -->
           
        </main>
    </div>

</body>
</html>
