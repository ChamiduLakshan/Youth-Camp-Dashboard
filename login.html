<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    
    <div class="login-container">
        <div class="brand-section">
            <div class="brand-content">
                <div class="logo-box">
                    <span class="logo-main">L<span class="logo-sub">EADERSHIP TRAINING</span></span>
                    <div class="tagline">Together We Rise Higher.</div>
                </div>
                <h1>Welcome to Youth Camp</h1>
                <p class="subtitle">National Youth Corps</p>
            </div>
        </div>

        <div class="form-section">
            <div class="form-content">
                <div class="icon-container">
                    <img src="images/nyclogo.jpeg" alt="Graduation Cap" class="grad-cap-image">
                </div>
                <h2>LOGIN TO STUDENT PORTAL</h2>
                
                <form id="loginForm" class="login-form">
                    <button type="submit" class="btn-login">LOGIN</button>
                </form>
                
            </div>
        </div>
    </div>
</body>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault(); 
        window.location.href = "index.html"; 
    });
</script>
</html>
