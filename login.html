<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="/images/backgroud.png" alt="Background" class="bg-image">
    
    <div class="login-container">
        <div class="brand-section">
            <div class="brand-content">
                <div class="logo-box">
                    <span class="logo-main">L<span class="logo-sub">EADERSHIP</span></span>
                    <div class="tagline">Together We Rise Higher.</div>
                </div>
                <h1>Welcome to Youth Camp</h1>
                <p class="subtitle">National Youth Corps</p>
            </div>
        </div>

        <div class="form-section">
            <div class="form-content">
                <h2>LOGIN TO STUDENT PORTAL</h2>
                
                <form action="index.html" method="POST" class="login-form">
                    <div class="input-group">
                        <label for="username">Username / Student ID</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn-login">LOGIN</button>
                </form>
                
            </div>
        </div>
    </div>
</body>
</html>
