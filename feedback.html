<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Page</title>
    <link rel="stylesheet" href="dashboard-style.css">
</head>
<body>

    <div class="portal-wrapper">
        
        <header class="portal-header">
            <div class="logo-container">
                <img src="images/YouthCampLogo.jpeg" alt="University Logo" class="uni-logo"><h4>Youth Camp 2026</h4>
            </div>
        </header>

        <section class="portal-banner">
            <div class="banner-content">
                <h1>Student Feedback</h1>
            </div>
        </section>

        
        <main class="portal-main">
            <div class="cards-container">
                
            
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSdu0DNlVVDyEUgs2ZHXaN8CUIfbNaNKTYlIMaygPUoXii_OSw/viewform?usp=sharing&ouid=112028929869128339564" class="portal-card applicant-card">
                    <div class="card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="48" height="48">
                          <!-- Graduation cap base paired with an exclamation warning/complaint badge -->
                          <path d="M12 2L1 7l11 5 9-4.09V14a1 1 0 0 0 2 0V7.5L12 2z"/>
                          <path d="M4.14 11.51l6.86 3.12 6.86-3.12V17c0 .55-.45 1-1 1H5.14c-.55 0-1-.45-1-1v-5.49z"/>
                          <circle cx="18" cy="18" r="4" fill="#ff4d4d"/>
                          <path d="M18 16v2.5M18 19.5h.01" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <span class="card-text">Day 01</span>
                </a>

                <a href="notavailable.html" class="portal-card applicant-card">
                    <div class="card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="48" height="48">
                          <!-- Graduation cap base paired with an exclamation warning/complaint badge -->
                          <path d="M12 2L1 7l11 5 9-4.09V14a1 1 0 0 0 2 0V7.5L12 2z"/>
                          <path d="M4.14 11.51l6.86 3.12 6.86-3.12V17c0 .55-.45 1-1 1H5.14c-.55 0-1-.45-1-1v-5.49z"/>
                          <circle cx="18" cy="18" r="4" fill="#ff4d4d"/>
                          <path d="M18 16v2.5M18 19.5h.01" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <span class="card-text">Day 02</span>
                </a>
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSe0lz5ZOCRT8XY34q-v5CR0wuC_ofp-wjqeeohzUygP_0waVQ/viewform?usp=sharing&ouid=112028929869128339564" class="portal-card applicant-card">
                    <div class="card-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="48" height="48">
                          <!-- Graduation cap base paired with an exclamation warning/complaint badge -->
                          <path d="M12 2L1 7l11 5 9-4.09V14a1 1 0 0 0 2 0V7.5L12 2z"/>
                          <path d="M4.14 11.51l6.86 3.12 6.86-3.12V17c0 .55-.45 1-1 1H5.14c-.55 0-1-.45-1-1v-5.49z"/>
                          <circle cx="18" cy="18" r="4" fill="#ff4d4d"/>
                          <path d="M18 16v2.5M18 19.5h.01" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <span class="card-text">Day 03</span>
                </a>
                <form id="loginForm" class="login-form">
                    <button type="submit" class="btn-login">Go Back</button>
                </form>
        </main>
    </div>

</body>
<script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault(); 
        window.location.href = "index.html"; 
    });
</script>
</html>
